server.port=8084

# Base MySQL dediee a notification-service
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/billing_notifications?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=billing_notifications
spring.datasource.password=${DB_NOTIFICATIONS_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false

# ---------- Eureka (V2) ----------
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# ---------- V5 : RabbitMQ (consumer) ----------
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
# Un message qui echoue n'est pas remis en boucle dans la queue
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# ---------- V5 : envoi des mails ----------
# Par defaut : serveur SMTP de test local (MailHog, voir docker-compose.yml) -> boite visible sur http://localhost:8025
# Pour un vrai envoi (Gmail) : host=smtp.gmail.com, port=587, username/password (mot de passe d'application),
# spring.mail.properties.mail.smtp.auth=true et spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.connectiontimeout=3000
spring.mail.properties.mail.smtp.timeout=3000
notification.mail.from=facturation@billing.local

management.endpoints.web.exposure.include=health,info
