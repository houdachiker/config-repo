server.port=8080

# ---------- Eureka (V2) ----------
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# ---------- Routage DYNAMIQUE (V2/V3) ----------
# Chaque service enregistre dans Eureka est automatiquement expose sous /<nom-du-service>/**
# ex : http://localhost:8080/service-clients/clients
spring.cloud.gateway.server.webflux.discovery.locator.enabled=true
spring.cloud.gateway.server.webflux.discovery.locator.lower-case-service-id=true

# ---------- Routage STATIQUE avec load balancing (lb:// = resolution Eureka + repartition entre instances) ----------
spring.cloud.gateway.server.webflux.routes[0].id=clients-route
spring.cloud.gateway.server.webflux.routes[0].uri=lb://service-clients
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/clients/**,/payments/**

spring.cloud.gateway.server.webflux.routes[1].id=abonnements-route
spring.cloud.gateway.server.webflux.routes[1].uri=lb://service-abonnements
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/plans/**,/subscriptions/**

spring.cloud.gateway.server.webflux.routes[2].id=facturation-route
spring.cloud.gateway.server.webflux.routes[2].uri=lb://service-facturation
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/invoices/**

spring.cloud.gateway.server.webflux.routes[3].id=notification-route
spring.cloud.gateway.server.webflux.routes[3].uri=lb://notification-service
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/notifications/**
