server.port=8083

# Base MySQL dediee au service-facturation
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/billing_facturation?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=billing_facturation
spring.datasource.password=${DB_FACTURATION_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false

# TVA appliquee aux factures
facturation.tva-rate=0.20

# ---------- V5 : RabbitMQ (publisher) ----------
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# ---------- Eureka (V2) ----------
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# ---------- V6 : timeouts Feign (connexion 2 s, lecture 3 s) + endpoints de supervision ----------
spring.cloud.openfeign.client.config.default.connect-timeout=2000
spring.cloud.openfeign.client.config.default.read-timeout=3000
management.endpoints.web.exposure.include=health,info,circuitbreakers,circuitbreakerevents,retries,retryevents
management.health.circuitbreakers.enabled=true

# ---------- V6 : Resilience4j - instance "clientService" ----------
# Retry : 3 tentatives, 500 ms entre chaque, uniquement sur erreurs techniques (service down / lent / 5xx).
resilience4j.retry.instances.clientService.max-attempts=3
resilience4j.retry.instances.clientService.wait-duration=500ms
resilience4j.retry.instances.clientService.retry-exceptions=feign.RetryableException,feign.FeignException$InternalServerError,feign.FeignException$ServiceUnavailable,feign.FeignException$BadGateway,feign.FeignException$GatewayTimeout
# Circuit Breaker : fenetre de 6 appels ; ouvert si >= 50 % d'echecs (apres 4 appels minimum) ;
# reste ouvert 15 s puis passe en half-open (2 appels test).
resilience4j.circuitbreaker.instances.clientService.sliding-window-size=6
resilience4j.circuitbreaker.instances.clientService.minimum-number-of-calls=4
resilience4j.circuitbreaker.instances.clientService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.clientService.wait-duration-in-open-state=15s
resilience4j.circuitbreaker.instances.clientService.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.clientService.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.clientService.record-exceptions=feign.RetryableException,feign.FeignException$InternalServerError,feign.FeignException$ServiceUnavailable,feign.FeignException$BadGateway,feign.FeignException$GatewayTimeout

# ---------- V6 : Resilience4j - instance "subscriptionService" ----------
# Retry : 3 tentatives, 500 ms entre chaque, uniquement sur erreurs techniques (service down / lent / 5xx).
resilience4j.retry.instances.subscriptionService.max-attempts=3
resilience4j.retry.instances.subscriptionService.wait-duration=500ms
resilience4j.retry.instances.subscriptionService.retry-exceptions=feign.RetryableException,feign.FeignException$InternalServerError,feign.FeignException$ServiceUnavailable,feign.FeignException$BadGateway,feign.FeignException$GatewayTimeout
# Circuit Breaker : fenetre de 6 appels ; ouvert si >= 50 % d'echecs (apres 4 appels minimum) ;
# reste ouvert 15 s puis passe en half-open (2 appels test).
resilience4j.circuitbreaker.instances.subscriptionService.sliding-window-size=6
resilience4j.circuitbreaker.instances.subscriptionService.minimum-number-of-calls=4
resilience4j.circuitbreaker.instances.subscriptionService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.subscriptionService.wait-duration-in-open-state=15s
resilience4j.circuitbreaker.instances.subscriptionService.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.subscriptionService.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.subscriptionService.record-exceptions=feign.RetryableException,feign.FeignException$InternalServerError,feign.FeignException$ServiceUnavailable,feign.FeignException$BadGateway,feign.FeignException$GatewayTimeout
